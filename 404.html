<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — CyphrWeb</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<style>
  :root { --bg:#0a0b0d; --text:#f2f1ed; --muted:#a9a9ac; --accent:#ea4c97; --accent-2:#8b6cf0; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center;
         background:var(--bg); color:var(--text); font-family:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; padding:24px; }
  h1 { font-size:clamp(3rem,12vw,6rem); margin:0 0 8px; background:linear-gradient(135deg,var(--accent),var(--accent-2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:var(--muted); margin:0 0 24px; }
  a.btn { display:inline-block; padding:12px 24px; border-radius:10px; color:#17091a; font-weight:600; text-decoration:none;
          background:linear-gradient(135deg,var(--accent),var(--accent-2)); }
  a.btn:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>This page doesn't exist — but your journey with CyphrWeb can still start.</p>
    <a class="btn" href="/">Back to CyphrWeb</a>
  </main>
</body>
</html>
